[project]
name = "bloodai-medical-research"
version = "0.1.0"
description = "Research notebooks for BERT-based multi-label clinical triage from laboratory tokens and adaptive interview signals."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Antoni Pater" },
    { name = "Jan Banasik" },
]
dependencies = [
    "accelerate>=0.30",
    "ipykernel>=6.29",
    "jupyter>=1.1",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "polars>=1.0",
    "scikit-learn>=1.5",
    "scipy>=1.12",
    "seaborn>=0.13",
    "tokenizers>=0.19",
    "torch>=2.2",
    "tqdm>=4.66",
    "transformers>=4.41",
    "xgboost>=2.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
